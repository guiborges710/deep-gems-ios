name: iOS MVP checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Test game rules and persistence
        run: swift test
      - name: Build iOS app without signing
        run: >-
          xcodebuild -project DeepGems.xcodeproj -scheme DeepGems
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build-ios CODE_SIGNING_ALLOWED=NO build
      - name: Launch on simulator and capture base
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if v["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" .build-ios/Build/Products/Debug-iphonesimulator/DeepGems.app
          xcrun simctl launch "$SIMULATOR_ID" com.guiborges.deepgems -deepgems-screenshot
          sleep 5
          mkdir -p visual-checks
          xcrun simctl io "$SIMULATOR_ID" screenshot visual-checks/base.png
      - uses: actions/upload-artifact@v4
        with:
          name: deepgems-base-screenshot
          path: visual-checks/base.png
